name: Guardar precio PVPC diario

on:
  schedule:
    # 22:00 UTC = 23:00 o 00:00 hora de Madrid según horario de verano/invierno.
    # A esa hora el PVPC del día ya está publicado y completo, así que sirve cualquiera de las dos.
    - cron: '0 22 * * *'
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña "Actions" para probarlo

permissions:
  contents: write

jobs:
  save-price:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar y guardar el precio de hoy
        run: node scripts/save-daily-price.js

      - name: Subir el CSV actualizado (si cambió)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pvpc-history.csv
          git diff --staged --quiet || git commit -m "Precio PVPC del día $(date -u +'%Y-%m-%d')"
          git push
